<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Admin</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>Panel Admina</h1>
  <button onclick="location.href='index.html'">Powrót</button>
</header>

<section>
  <h2>➕ Dodaj</h2>
  <div class="row">
    <input type="number" id="addId" placeholder="ID">
    <input type="text" id="addName" placeholder="Imię">

    <select id="addRole">
      <option>10 | Chief of Family</option>
      <option>9 | Deputy Chief of Family</option>
      <option>8 | Asst. Chief of Family</option>
      <option>7 | Awakend</option>
      <option>6 | Chosen</option>
      <option>5 | Seeker</option>
      <option>4 | Adept</option>
      <option>3 | Member</option>
      <option>2 | Cadet</option>
      <option>1 | Vacation/Suspended</option>
    </select>

    <button id="addBtn">Dodaj</button>
  </div>
</section>

<section>
  <h2>❌ Usuń</h2>
  <input type="number" id="removeId">
  <button id="removeBtn">Usuń</button>
</section>

<section>
  <h2>✏️ Edytuj</h2>
  <input type="number" id="editId">
  <input type="text" id="editName">
  <select id="editRole">
    <option>10 | Chief of Family</option>
    <option>9 | Deputy Chief of Family</option>
    <option>8 | Asst. Chief of Family</option>
    <option>7 | Awakend</option>
    <option>6 | Chosen</option>
    <option>5 | Seeker</option>
    <option>4 | Adept</option>
    <option>3 | Member</option>
    <option>2 | Cadet</option>
    <option>1 | Vacation/Suspended</option>
  </select>
  <button id="editBtn">Zmień</button>
</section>

<script src="admin.js"></script>
</body>
</html>
